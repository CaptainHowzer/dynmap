buildscript {
    configurations.all {
        resolutionStrategy {
            force("org.ow2.asm:asm:9.9.1")
            force("org.ow2.asm:asm-commons:9.9.1")
        }
    }
}

plugins {
	// id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	// id  "io.github.goooler.shadow" version "8.1.7"
  id "com.gradleup.shadow" version "9.3.0"
  id  'java'
}
apply plugin: 'eclipse'

eclipse {
    project {
        name = "Dynmap"
    }
}

allprojects  {
  repositories {
     mavenLocal()
     maven { url 'https://libraries.minecraft.net/' }
     maven { url "https://maven.pkg.github.com/linktosriram/s3-lite"
          credentials {
              username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
              password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
          }
     }
     maven { url "https://oss.sonatype.org/content/repositories/releases" }
     maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
     maven { url "https://repo.mikeprimm.com" }
     maven { url "https://repo.maven.apache.org/maven2" }
     maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
     maven { url "https://repo.codemc.org/repository/maven-public/" }
  }

  apply plugin: 'java'
  
  group = 'us.dynmap'
  version = '3.9-SNAPSHOT'

}

class Globals {
  String buildNumber =  System.getenv().BUILD_NUMBER ?: "Dev"
}
ext {
  globals = new Globals()
}
tasks.withType(JavaCompile) {
    options.compilerArgs += ["-Xmaxerrs", "5000"] // augmenter à 5000 erreurs
}

subprojects {  
  // apply plugin: "io.github.goooler.shadow"
  apply plugin: 'com.gradleup.shadow'
  apply plugin: 'java'
  apply plugin: 'maven-publish'

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}
  tasks.withType(JavaCompile) {
  	options.encoding = 'UTF-8'
  }
	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}

clean {
  delete "target" 
}

task setupCIWorkspace {
}
